name: CI

# Every push to the working branches and every pull request runs the same checks that gate a merge to main.
on:
  push:
    branches: [main, stage-2-dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  emulators:
    name: Security rules and sync (Firebase emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run test:rules
      - run: npm run test:sync

  e2e:
    name: End-to-end (Playwright, phone / tablet / desktop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  # Firefox and WebKit (Safari's engine, with an iPhone viewport) on Linux. Reported but not required to merge yet: they
  # have never run in CI, so the first results show what needs fixing. Make this a required check once it is green.
  e2e-other-browsers:
    name: End-to-end (Firefox and WebKit)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npx playwright test --project=firefox --project=webkit-iphone --project=webkit-desktop
        env: { PW_ALL_BROWSERS: '1' }
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-other-browsers
          path: |
            playwright-report
            test-results
          retention-days: 7
